<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI 剪刀石頭布</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>AI 剪刀石頭布</h1>

<div class="arena">

<div class="player">
<h2>玩家</h2>
<div id="playerHand" class="hand">❔</div>
</div>

<div class="vs">VS</div>

<div class="ai">
<h2>AI</h2>
<div id="aiHand" class="hand">❔</div>
</div>

</div>

<div class="buttons">

<button onclick="play('rock')">✊</button>
<button onclick="play('paper')">✋</button>
<button onclick="play('scissors')">✌️</button>

</div>

<h2 id="result"></h2>

<div class="score">

玩家勝利: <span id="playerScore">0</span>
<br>
AI勝利: <span id="aiScore">0</span>

</div>

<script src="script.js"></script>

</body>
</html>
