<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<title>Access Denied</title>

<link rel="stylesheet" href="/style.css">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

.container{
    background:#1e293b;
    padding:50px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

p{
    font-size:20px;
    opacity:0.8;
}

.btn{
    margin-top:25px;
    padding:10px 25px;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

.btn:hover{
    background:#2563eb;
}

</style>

</head>

<body>

<div class="container">

<h1>ACCESS DENIED</h1>

<p>你沒有權限進入網頁</p>

<p style="font-size:14px;opacity:0.6">
Your IP is not in the whitelist
</p>

<button class="btn" onclick="location.reload()">
重新嘗試
</button>

</div>

</body>
</html>
