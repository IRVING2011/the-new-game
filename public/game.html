<!DOCTYPE html>
<html>

<head>
<title>RPS Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 右上角比分 -->

<div class="scoreboard">

<div>Player Wins: <span id="playerScore">0</span></div>
<div>AI Wins: <span id="aiScore">0</span></div>

</div>


<div class="container">

<h1>Rock Paper Scissors</h1>

<!-- 對戰畫面 -->

<div class="battle">

<div id="playerHand">❔</div>

<div class="vs">VS</div>

<div id="aiHand">❔</div>

</div>

<div class="result" id="result"></div>

<!-- 按鈕 -->

<div class="buttons">

<button class="rock" onclick="play('rock')">✊ Rock</button>
<button class="paper" onclick="play('paper')">✋ Paper</button>
<button class="scissors" onclick="play('scissors')">✌ Scissors</button>

</div>

</div>

<script src="game.js"></script>

</body>

</html>
